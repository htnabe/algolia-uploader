name: Secure Publish to npm

on:
  workflow_run:
    workflows: ["Run Vitest Tests on Push"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write  # Required for OIDC
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release_gate.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1

      - name: Determine whether this is a release bump
        id: release_gate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=${CURRENT_VERSION}"

          if ! git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No parent commit available; skipping publish."
            exit 0
          fi

          if git diff --name-only "${HEAD_SHA}^" "${HEAD_SHA}" -- package.json package-lock.json | grep -qE '^(package\.json|package-lock\.json)$'; then
            PACKAGE_FILES_CHANGED=true
          else
            PACKAGE_FILES_CHANGED=false
          fi

          if [ "${PACKAGE_FILES_CHANGED}" != "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No package version file changes detected; skipping publish."
            exit 0
          fi

          PREVIOUS_VERSION=$(git show "${HEAD_SHA}^:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "previous_version=${PREVIOUS_VERSION}"

          if [[ "${CURRENT_VERSION}" == "${PREVIOUS_VERSION}" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version did not change; skipping publish."
            exit 0
          fi

          # -p/--include-prerelease is required so that prerelease versions (e.g. 0.0.20-rc.1)
          # are considered against a range built from a non-prerelease previous version
          # (e.g. >0.0.19). Without it, node-semver's range matching always excludes
          # prerelease versions unless the range itself carries a prerelease on the same
          # [major, minor, patch] tuple, which incorrectly skipped every new rc/beta release.
          if ! npx semver -p -r ">${PREVIOUS_VERSION}" "${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version did not increase from ${PREVIOUS_VERSION} to ${CURRENT_VERSION}; skipping publish."
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Release version bump detected: ${PREVIOUS_VERSION} -> ${CURRENT_VERSION}"

      - name: Run audit (warn on high)
        run: npm audit --audit-level=high || true

  publish:
    needs: verify
    if: ${{ needs.verify.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    environment: publish
    # contents: write is scoped to this job only (verify keeps contents: read) so the
    # least-privileged token is used, and is only usable after the environment's
    # protection rules (if any) have been satisfied for this job.
    permissions:
      id-token: write  # Required for OIDC
      contents: write  # Required to push the release tag and create the GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Trusted publishing needs npm >= 11.5.1; npm 12 requires a newer Node than this workflow uses.
      - name: Update npm
        run: npm install -g npm@^11

      - name: Install for publish
        run: npm ci

      - name: Verify package version is valid semver
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package=${PKG_VERSION}"
          if ! [[ "${PKG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version is not valid semver: ${PKG_VERSION}"; exit 1
          fi

      - name: Build for publish
        run: npm run build

      - name: Verify dist artifacts
        run: |
          ls -la dist
          test -f dist/index.mjs

      - name: Pack (sanity)
        run: npm pack

      - name: Resolve npm dist-tag
        id: npm_tag
        env:
          NPM_PRERELEASE_DIST_TAG: ${{ vars.NPM_PRERELEASE_DIST_TAG }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_DIST_TAG=latest

          if [[ "${PKG_VERSION}" == *"-"* ]]; then
            PRE_RELEASE_ID=${PKG_VERSION#*-}
            PRE_RELEASE_ID=${PRE_RELEASE_ID%%+*}
            PRE_RELEASE_ID=${PRE_RELEASE_ID%%.*}
            PRE_RELEASE_ID=${PRE_RELEASE_ID,,}

            case "${PRE_RELEASE_ID}" in
              beta)
                NPM_DIST_TAG=beta
                ;;
              rc)
                NPM_DIST_TAG=rc
                ;;
              next)
                NPM_DIST_TAG=next
                ;;
              *)
                NPM_DIST_TAG=${NPM_PRERELEASE_DIST_TAG:-next}
                ;;
            esac
          fi

          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=${NPM_DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${PKG_VERSION} with npm dist-tag '${NPM_DIST_TAG}'"

      - name: Publish to npm
        run: |
          # Uses npm trusted publishing (OIDC), so no npm token secret is required.
          npm publish --provenance --access public --tag "${{ steps.npm_tag.outputs.npm_dist_tag }}"

      # The following steps only run after "Publish to npm" has succeeded, because a
      # step failure stops the job before later steps run. This guarantees the tag and
      # GitHub Release are never created for a version that failed to publish.
      - name: Create release tag
        id: create_tag
        env:
          PKG_VERSION: ${{ steps.npm_tag.outputs.pkg_version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          TAG_NAME="v${PKG_VERSION}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists; skipping tag creation."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Tag the exact commit that was verified and published, not a possibly-advanced
          # branch HEAD.
          git tag -a "${TAG_NAME}" "${HEAD_SHA}" -m "${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ steps.create_tag.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.create_tag.outputs.tag_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PKG_VERSION: ${{ steps.npm_tag.outputs.pkg_version }}
        run: |
          set -euo pipefail

          PRERELEASE_FLAG=()
          if [[ "${PKG_VERSION}" == *"-"* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          gh release create "${TAG_NAME}" \
            --target "${HEAD_SHA}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            "${PRERELEASE_FLAG[@]}"
